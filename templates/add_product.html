{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 700px; margin: 40px auto; padding: 40px;">
    <h2>{{ 'Edit' if product else 'Add' }} Product</h2>
    <hr>
    <form method="POST" enctype="multipart/form-data">
        <label>Product Title</label>
        <input type="text" name="title" value="{{ product.title if product else '' }}" required class="input-field" style="width: 100%; margin-bottom: 20px; padding: 10px;">
        
        <label>Description</label>
        <textarea name="description" class="input-field" rows="4" style="width: 100%; margin-bottom: 20px; padding: 10px;">{{ product.description if product else '' }}</textarea>

        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <label>Sale Price ($)</label>
                <input type="number" step="0.01" name="price" value="{{ product.price if product else '' }}" required class="input-field" style="width: 100%; margin-bottom: 20px; padding: 10px;">
            </div>
            <div style="flex: 1;">
                <label>Regular Price ($) (Optional)</label>
                <input type="number" step="0.01" name="old_price" value="{{ product.old_price if product else '' }}" class="input-field" style="width: 100%; margin-bottom: 20px; padding: 10px;">
            </div>
        </div>

        <div style="display: flex; gap: 20px;">
            <div style="flex: 1;">
                <label>Discount Start</label>
                <input type="datetime-local" name="discount_start" value="{{ product.discount_start if product else '' }}" class="input-field" style="width: 100%; margin-bottom: 20px; padding: 10px;">
            </div>
            <div style="flex: 1;">
                <label>Discount End</label>
                <input type="datetime-local" name="discount_end" value="{{ product.discount_end if product else '' }}" class="input-field" style="width: 100%; margin-bottom: 20px; padding: 10px;">
            </div>
        </div>

        <label>Category</label>
        <select name="category_id" class="input-field" style="width: 100%; margin-bottom: 20px; padding: 10px;">
            {% for cat in categories %}
            <option value="{{ cat.id }}" {% if product and product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>

        <label>Available Colors (e.g. Red, Blue, Black)</label>
        <input type="text" name="colors" value="{{ colors if colors else '' }}" class="input-field" style="width: 100%; margin-bottom: 20px; padding: 10px;">

        <label>Available Sizes (e.g. S, M, L, XL)</label>
        <input type="text" name="sizes" value="{{ sizes if sizes else '' }}" class="input-field" style="width: 100%; margin-bottom: 20px; padding: 10px;">

        <label>Initial Stock Count</label>
        <input type="number" name="inventory" value="{{ product.inventory if product else 0 }}" class="input-field" style="width: 100%; margin-bottom: 20px; padding: 10px;">

        {% if not product %}
        <label>Primary Image</label>
        <input type="file" name="image" class="input-field" style="width: 100%; margin-bottom: 20px;">
        {% endif %}

        <button type="submit" class="btn" style="width: 100%; background: #3498db; color: white; padding: 15px; border: none; font-weight: bold; cursor: pointer;">
            {{ 'Update Product' if product else 'Publish Product' }}
        </button>
    </form>
</div>
{% endblock %}
